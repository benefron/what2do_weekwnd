name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/latest.json'
      - 'automation/**'
      - '.github/workflows/**'
  # PRs run the test job only (build/deploy are gated below) — otherwise the
  # suites would first execute remotely *after* a merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install -r automation/requirements.txt -r automation/requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Node tests
        working-directory: frontend
        run: npm run test

      - name: Lint
        working-directory: frontend
        run: npm run lint

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Sync pipeline data into public/
        run: |
          set -euo pipefail
          mkdir -p frontend/public/data
          cp data/latest.json frontend/public/data/latest.json

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /what2do_weekwnd/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
