name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/latest.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Sync pipeline data into public/
        run: |
          set -euo pipefail
          mkdir -p frontend/public/data
          cp data/latest.json frontend/public/data/latest.json

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /what2do_weekwnd/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
